<!-- The sponsor banner (1600x640), for the diginode-sponsors README and anywhere else that points people to the sponsors
     page. Drawn to ../sponsor-banner.png with (from this folder):
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=1600,640 --screenshot=../sponsor-banner.png sponsor-banner.html

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:640px;overflow:hidden}
body{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#fff;

svg.net{position:absolute;inset:0}
.net line{stroke:#5aa9ff;stroke-opacity:.15;stroke-width:1.2}

.left{position:absolute;left:90px;top:0;bottom:0;width:860px;display:flex;flex-direction:column;justify-content:center}
.logo{width:280px;margin-bottom:26px;opacity:.95}

.ways{display:flex;gap:18px;margin-top:34px}

.way svg{width:34px;height:34px}
.url{margin-top:36px;align-self:flex-start;font-size:32px;font-weight:700;letter-spacing:.4px;background:#0066CC;border-radius:999px;padding:12px 34px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.right{position:absolute;right:90px;top:50%;transform:translateY(-50%);text-align:center}
.badge{width:430px;height:430px;border-radius:50%;box-shadow:0 0 0 14px rgba(90,169,255,.12),0 0 0 30px rgba(90,169,255,.06),0 0 90px rgba(90,169,255,.45)}
.badge img{width:430px;height:430px;display:block;border-radius:50%}
