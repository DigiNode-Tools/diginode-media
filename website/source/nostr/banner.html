.text{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:30px 60px;border-radius:40px;background:radial-gradient(ellipse at center,rgba(0,35,82,.85) 40%,rgba(0,35,82,0) 72%)}
.logo{width:420px}
h1{font-weight:800;font-style:italic;font-size:66px;white-space:nowrap;line-height:1.04;letter-spacing:-1.5px}
p{font-weight:700;font-size:27px;color:#cfe4ff;white-space:nowrap}
