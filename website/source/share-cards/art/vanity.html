<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&display=block">
<style>
/* Example words avoid b, i, o and 1, which DigiByte addresses never contain. */
.va{position:absolute;right:62px;top:160px;width:480px;display:flex;flex-direction:column;gap:14px}
.va .card{border-radius:18px;overflow:hidden;background:#0b1220;border:2px solid rgba(156,200,255,.3);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.va .head{display:flex;align-items:center;gap:12px;padding:15px 22px;background:rgba(255,255,255,.06);font-weight:800;font-size:20px;letter-spacing:2px;color:#7fb8ff;text-transform:uppercase}
.va .body{padding:24px 22px 26px}
.va .big{font:600 30px/1.3 'JetBrains Mono',monospace;color:#e8f0fb;white-space:nowrap}
.va mark{background:#ffd75e;color:#2b1f00;border-radius:6px;padding:0 4px;margin:0 2px}
.va .row{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid rgba(156,200,255,.3)}
.va .row code{font:600 23px 'JetBrains Mono',monospace;color:#e8f0fb;white-space:nowrap}
.va .row mark{padding:0 3px;margin:0 1px;border-radius:5px}
.va .row small{font-weight:800;font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:#7fb8ff}
</style>
<div class="va">
  <div class="card">
    <div class="head">{{icon:digibyte-logo:#5aa9ff:30}}Your DigiByte address</div>
    <div class="body"><div class="big">dgb1q<mark>dgnd</mark>5ftqy60n…</div></div>
  </div>
  <div class="row"><code>dgb1q<mark>cafe</mark>7hx3m0c…</code><small>Start</small></div>
  <div class="row"><code>dgb1q…k4zr8y<mark>seed</mark></code><small>End</small></div>
</div>
